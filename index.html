<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./css_styles/btn.css" />
        <link rel="stylesheet" href="./css_styles/end-page.css" />
        <link rel="stylesheet" href="./css_styles/standard.css" />
        <link rel="stylesheet" href="style.css" />
        <script type="module" src="levels/level1.js" defer></script>
        <script type="module" src="game.js" defer></script>
        <title>EL POLLO LOCO</title>
        <link rel="icon" type="image/x-icon" href="./assets/icons/22266chicken_98785.svg" />
    </head>
    <body>
        <header>
            <h1>EL POLLO LOCO</h1>
        </header>
        <section id="game-screen" class="game-screen">
            <div id="ingame-controls" class="ingame-controls d-none">
                <button id="btn-ingame-mute" class="circle-btn"><img src="./assets/icons/volume-mute.svg" alt="Stumm Button im Spiel" /></button>
                <button id="btn-ingame-pause" class="circle-btn"><img src="./assets/icons/pause-circle.svg" alt="Pausier Button im Spiel" /></button>
            </div>

            <div id="pause-screen" class="game-pause d-none">
                <div class="menu-content settings-box">
                    <h2>Spiel Pausiert</h2>
                    <button id="btn-resume" class="menu-btn">Weiter spielen</button>
                </div>
            </div>

            <canvas id="canvas" width="960" height="540"></canvas>

            <div id="mobile-controls" class="mobile-controls d-none">
                <div class="joystick-left">
                    <button id="touch-left" class="touch-btn">
                        <img src="./assets/icons/chevron-double-left.svg" alt="Touch Button links" />
                    </button>
                    <button id="touch-right" class="touch-btn">
                        <img src="./assets/icons/chevron-double-right.svg" alt="Touch Button rechts" />
                    </button>
                </div>
                <div id="joystick-right">
                    <button id="touch-jump" class="touch-btn action-btn">
                        <img src="./assets/icons/chevron-double-up.svg" alt="Touch Button Sprung" />
                    </button>
                    <button id="touch-throw" class="touch-btn action-btn">
                        <img src="./assets/icons/clipart1871127.png" alt="Touch Button Flasche werfen" />
                    </button>
                </div>
            </div>

            <div id="landing-page" class="landing-page">
                <img src="assets/img/9_intro_outro_screens/start/startscreen_1.png" alt="Start Screen EL POLLO LOCO" class="bg-img" />
                <div class="menu-content">
                    <button id="btn-start" class="btn-start">Spiel starten</button>
                    <div class="right-buttons">
                        <button id="btn-settings" class="btn-settings"><img src="./assets/icons/gear.svg" alt="Einstellungen" /></button>
                        <button id="btn-mute" class="btn-mute"><img src="./assets/icons/volume-mute.svg" alt="Ton-Aus" /></button>
                    </div>
                </div>
            </div>

            <div id="settings-screen" class="settings-screen d-none">
                <div class="menu-content settings-box">
                    <h2>Einstellungen</h2>
                    <div class="settings-row">
                        <label for="volume-slider">🎵 Lautstärke:</label>
                        <div class="slider-container">
                            <input type="range" id="volume-slider" min="0" max="100" value="40" class="volume-slider" />
                            <span id="volume-value">40%</span>
                        </div>
                    </div>
                    <div class="settings-row">
                        <label>🖥️ Grafik:</label>
                        <button id="btn-graphics" class="menu-btn setting-toggle-btn">Qualität: Hoch</button>
                    </div>
                    <div class="settings-row border-top">
                        <button id="btn-howto" class="menu-btn">Spielanleitung</button>
                        <button id="btn-settings-back" class="menu-btn btn-settings-back">Zurück</button>
                    </div>
                </div>
            </div>

            <div id="howto-screen" class="howto-screen d-none">
                <div class="menu-content settings-box">
                    <h2>Spielanleitung</h2>
                    <div class="instructions">
                        <p><strong>Links</strong><img src="./assets/icons/arrow-left-square.svg" alt="Pfeiltaste Links" /></p>
                        <p><strong>Rechts</strong><img src="./assets/icons/arrow-right-square.svg" alt="Pfeiltaste Rechts" /></p>
                        <p><strong>Sprung</strong><img src="./assets/icons/arrow-up-square.svg" alt="Pfeiltaste Oben" /></p>
                        <p><strong>Werfen</strong><img src="./assets/icons/spacebar-svgrepo-com.svg" alt="Space Taste" /></p>
                    </div>
                    <button id="btn-howto-back" class="btn-howto-back">Zurück</button>
                </div>
            </div>

            <div id="game-over" class="game-over d-none">
                <img src="./assets/img/You won, you lost/Game Over.png" alt="Game Over Screen" class="bg-img" />
                <div class="menu-content endgame-buttons">
                    <button class="btn-restart menu-btn">Nochmal versuchen</button>
                    <button class="btn-home menu-btn back-btn">Hauptmenü</button>
                </div>
            </div>

            <div id="game-win" class="game-win d-none">
                <img src="./assets/img/You won, you lost/You win B.png" alt="You Win Screen" class="bg-img" />
                <div class="menu-content endgame-buttons">
                    <button class="btn-restart menu-btn">Nochmal spielen</button>
                    <button class="btn-home menu-btn back-btn">Hauptmenü</button>
                </div>
            </div>

            <div id="rotate-screen" class="rotate-screen">
                <div class="rotate-message">
                    <div class="phone-icon"></div>
                    <p>Por favor! Bitte drehe dein Gerät waagerecht, um El Pollo Loco zu spielen!</p>
                </div>
            </div>
        </section>
        <footer id="footer" class="footer">
            <p>&copy; 2026 M. Elias Hashimi |</p>
            <a href="https://github.com/eliashashimi" target="_blank">GitHub Profil</a>
            <a href="">Impressum</a>
        </footer>
    </body>
</html>
